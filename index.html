<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Display Apartel</title>
<style>
:root {
  --bg-main: #000000;
  --text-header: #ffd700;
  --accent: #ffd700;
  --bg-ticker: #0a0a0a;
  --text-ticker: #ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:var(--bg-main);color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column}

.header{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:10px 30px;background:transparent;border-bottom:2px solid var(--accent)}
.header-left{text-align:left; max-width:60%;}
.apt-name{font-size:1.4rem;font-weight:bold;color:var(--text-header);letter-spacing:1px;text-shadow:0 0 10px rgba(255,215,0,0.3)}
.apt-address{font-size:0.85rem;color:#ccc;margin-top:5px;}

.header-right{text-align:right}
.clock{font-size:2.2rem;font-weight:bold;color:var(--text-header);line-height:1}
.date{font-size:0.9rem;color:#ccc;margin-top:2px}

.video-container{flex:1;display:flex;justify-content:center;align-items:center;background:#000;padding:10px;min-height:0;position:relative}
#youtubePlayer{width:100%;height:100%;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 20px rgba(255,215,0,0.2)}

.footer{flex-shrink:0;background:var(--bg-ticker);border-top:2px solid var(--accent);padding:15px 0;overflow:hidden}
.ticker-text{white-space:nowrap;display:inline-block;font-size:1.4rem;color:var(--text-ticker);animation:scrollText 400s linear infinite;font-weight:bold}
.ticker-text span{color:var(--accent);margin:0 50px;}
@keyframes scrollText { 0% {transform:translateX(100%)} 100% {transform:translateX(-100%)} }

#startOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;cursor:pointer;text-align:center}
#startOverlay h2{color:var(--text-header);font-size:2.5rem;margin-bottom:20px}
#startOverlay p{color:#ccc;font-size:1.2rem}
.btn-start{margin-top:30px;padding:15px 40px;background:var(--accent);color:#000;font-size:1.2rem;font-weight:bold;border:none;border-radius:50px;cursor:pointer;}
</style>
</head>
<body>

<div id="startOverlay" onclick="startDisplay()">
    <h2>SELAMAT DATANG</h2>
    <p>Klik layar ini untuk memulai pemutaran video & mengaktifkan suara.</p>
    <button class="btn-start">▶ MULAI DISPLAY</button>
</div>

<header class="header">
    <div class="header-left">
        <div class="apt-name" id="aptName">NAMA APARTEL</div>
        <div class="apt-address" id="aptAddress">Alamat</div>
    </div>
    <div class="header-right">
        <div class="clock" id="clockTime">00:00</div>
        <div class="date" id="clockDate">Tanggal</div>
    </div>
</header>

<div class="video-container">
    <iframe id="youtubePlayer" src="" frameborder="0" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
</div>

<footer class="footer">
    <div class="ticker-text" id="aptTicker"><span>★</span> Memuat teks... <span>★</span></div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlNDaftpdvCvtCq3S9JjBHileRQnDaZAY",
  authDomain: "robot-pintar-7b1a3.firebaseapp.com",
  databaseURL: "https://robot-pintar-7b1a3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "robot-pintar-7b1a3",
  storageBucket: "robot-pintar-7b1a3.firebasestorage.app",
  messagingSenderId: "908302592700",
  appId: "1:908302592700:web:0cd39ac0dcaaaa4704feb9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let player = document.getElementById('youtubePlayer');
let videoIds = [];

// 1. Update Jam
function updateClock() {
    let d = new Date();
    let h = String(d.getHours()).padStart(2, '0');
    let m = String(d.getMinutes()).padStart(2, '0');
    let s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clockTime').innerText = `${h}:${m}:${s}`;
    
    let days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    let months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    document.getElementById('clockDate').innerText = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

// 2. Load Warna
db.ref('apartemen/colors').on('value', (snap) => {
    if(snap.exists()) {
        let c = snap.val();
        let root = document.documentElement.style;
        root.setProperty('--bg-main', c.bg_main || '#000');
        root.setProperty('--text-header', c.text_header || '#ffd700');
        root.setProperty('--accent', c.accent || '#ffd700');
        root.setProperty('--bg-ticker', c.bg_ticker || '#0a0a0a');
        root.setProperty('--text-ticker', c.text_ticker || '#fff');
    }
});

// 3. Load Teks & Nama
db.ref('apartemen/settings').on('value', (snap) => {
    if(snap.exists()) {
        document.getElementById('aptName').innerText = snap.val().nama || 'Nama Apartel';
        document.getElementById('aptAddress').innerText = snap.val().alamat || 'Alamat';
        let t = snap.val().ticker || 'Selamat Datang';
        document.getElementById('aptTicker').innerHTML = `<span>★</span> ${t} <span>★</span> ${t} <span>★</span> ${t} <span>★</span>`;
    }
});

// 4. Load Video YouTube
db.ref('apartemen/videos').on('value', (snap) => {
    videoIds = [];
    if(snap.exists()) {
        snap.forEach(c => {
            let url = c.val().url;
            let match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
            if(match) videoIds.push(match[1]);
        });
        if(videoIds.length > 0) {
            loadYouTube();
        }
    }
});

function loadYouTube() {
    if(videoIds.length === 0) return;
    let firstVideo = videoIds[0];
    let playlistStr = videoIds.join(',');
    
    // Setup iframe autoplay, mute, loop playlist
    let src = `https://www.youtube.com/embed/${firstVideo}?playlist=${playlistStr}&autoplay=1&mute=1&loop=1&controls=0&modestbranding=1&rel=0&playsinline=1&enablejsapi=1`;
    player.src = src;
}

function startDisplay() {
    document.getElementById('startOverlay').style.display = 'none';
    // Unmute video YouTube
    player.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
    player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
}
</script>
</body>
</html>

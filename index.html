<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Display Apartemen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.header{flex-shrink:0;text-align:center;padding:20px;background:linear-gradient(to bottom, #000, #0a0a0a)}
.header h1{font-size:3rem;color:#ffd700;text-transform:uppercase;letter-spacing:3px;text-shadow:0 0 10px rgba(255,215,0,0.5)}
.header p{font-size:1.2rem;color:#ccc;margin-top:5px}
.video-container{flex:1;display:flex;justify-content:center;align-items:center;background:#000;padding:10px;min-height:0}
video{max-width:100%;max-height:100%;border:2px solid #ffd700;border-radius:10px;box-shadow:0 0 20px rgba(255,215,0,0.2)}
.footer{flex-shrink:0;background:#0a0a0a;border-top:2px solid #ffd700;padding:15px 0;overflow:hidden}
.ticker-text{white-space:nowrap;display:inline-block;font-size:1.5rem;color:#fff;animation:scrollText 30s linear infinite;font-weight:bold}
.ticker-text span{color:#ffd700;margin:0 50px;}
@keyframes scrollText { 0% {transform:translateX(100%)} 100% {transform:translateX(-100%)} }

/* Overlay Tombol Mulai */
#startOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;cursor:pointer;text-align:center}
#startOverlay h2{color:#ffd700;font-size:2.5rem;margin-bottom:20px}
#startOverlay p{color:#ccc;font-size:1.2rem}
.btn-start{margin-top:30px;padding:15px 40px;background:#ffd700;color:#000;font-size:1.2rem;font-weight:bold;border:none;border-radius:50px;cursor:pointer;}
</style>
</head>
<body>

<!-- Overlay untuk mengaktifkan suara (Wajib karena kebijakan Browser) -->
<div id="startOverlay" onclick="startDisplay()">
    <h2>Selamat Datang</h2>
    <p>Klik layar ini untuk memulai pemutaran video & mengaktifkan suara.</p>
    <button class="btn-start">▶ MULAI DISPLAY</button>
</div>

<header class="header">
    <h1 id="aptName">NAMA APARTEMEN</h1>
    <p id="aptAddress">Alamat Apartemen</p>
</header>

<div class="video-container">
    <video id="videoPlayer" autoplay playsinline></video>
</div>

<footer class="footer">
    <div class="ticker-text" id="aptTicker"><span>Memuat teks...</span></div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlNDaftpdvCvtCq3S9JjBHileRQnDaZAY", // Samakan dengan config atas
  authDomain: "robot-pintar-7b1a3.firebaseapp.com",
  databaseURL: "https://robot-pintar-7b1a3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "robot-pintar-7b1a3",
  storageBucket: "robot-pintar-7b1a3.firebasestorage.app",
  messagingSenderId: "908302592700",
  appId: "1:908302592700:web:0cd39ac0dcaaaa4704feb9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let videoList = [];
let currentVideo = 0;
let videoPlayer = document.getElementById('videoPlayer');

// Load Settings
db.ref('apartemen/settings').on('value', (snap) => {
    if(snap.exists()) {
        document.getElementById('aptName').innerText = snap.val().nama || 'Nama Apartemen';
        document.getElementById('aptAddress').innerText = snap.val().alamat || 'Alamat';
        document.getElementById('aptTicker').innerHTML = '<span>★</span> ' + (snap.val().ticker || 'Selamat Datang') + ' <span>★</span> ' + (snap.val().ticker || 'Selamat Datang') + ' <span>★</span>';
    }
});

// Load Videos
db.ref('apartemen/videos').on('value', (snap) => {
    videoList = [];
    if(snap.exists()) {
        snap.forEach(c => videoList.push(c.val().url));
        if(videoList.length > 0 && videoPlayer.paused) {
            playVideo(0);
        }
    }
});

function playVideo(index) {
    if(videoList.length === 0) return;
    videoPlayer.src = videoList[index];
    videoPlayer.load();
    videoPlayer.play().catch(e => console.log("Menunggu klik user untuk mainkan suara..."));
}

// Otomatis ganti video ke video berikutnya jika video selesai
videoPlayer.addEventListener('ended', () => {
    currentVideo = (currentVideo + 1) % videoList.length;
    playVideo(currentVideo);
});

function startDisplay() {
    // Hilangkan overlay
    document.getElementById('startOverlay').style.display = 'none';
    // Paksa putar video dengan suara
    videoPlayer.muted = false;
    videoPlayer.play();
}
</script>
</body>
</html>

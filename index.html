<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Display Apartel</title>
<style>
:root {
  --bg-main: #000000;
  --bg-video: #000000;
  --text-header: #ffd700;
  --accent: #ffd700;
  --bg-ticker: #0a0a0a;
  --text-ticker: #ffffff;
  --text-address: #cccccc;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:var(--bg-main);color:#fff;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}

.header{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:clamp(5px, 1.5vw, 10px) clamp(10px, 3vw, 30px);background:transparent;border-bottom:2px solid var(--accent)}
.header-left{display:flex;align-items:center;gap:10px;max-width:100%;}
#aptLogo{height:clamp(35px, 8vw, 60px);width:auto;display:none;object-fit:contain;}
.text-block{text-align:left;}
.apt-name{font-size:clamp(0.9rem, 3vw, 1.4rem);font-weight:bold;color:var(--text-header);letter-spacing:1px;text-shadow:0 0 10px rgba(255,215,0,0.3)}
.apt-address{font-size:clamp(0.65rem, 2vw, 0.85rem);color:var(--text-address);margin-top:3px;}

.header-right{text-align:right}
.clock{font-size:clamp(1rem, 4vw, 2.2rem);font-weight:bold;color:var(--text-header);line-height:1}
.date{font-size:clamp(0.65rem, 2vw, 0.9rem);color:var(--text-address);margin-top:2px}

.video-container{flex:1;position:relative;background-color:var(--bg-video);background-size:cover;background-position:center;min-height:0;overflow:hidden}

#videoPlayer{
    position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none;
}

#youtubePlayer{
    position:absolute;top:50%;left:50%;width:200%;height:200%;transform:translate(-50%, -50%);border:none;pointer-events:none;
}

.footer{flex-shrink:0;background:var(--bg-ticker);border-top:2px solid var(--accent);padding:clamp(8px, 1.5vw, 15px) 0;overflow:hidden;display:flex}
.ticker-wrap{display:flex;animation:scrollText 60s linear infinite;width:max-content}
.ticker-text{font-size:clamp(0.8rem, 2.5vw, 1.4rem);color:var(--text-ticker);font-weight:bold;padding-right:50px;white-space:nowrap}
.ticker-text span{color:var(--accent);margin-right:50px}
@keyframes scrollText { 0% { transform: translateX(0) } 100% { transform: translateX(-50%) } }

/* Overlay Fullscreen */
#startOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;cursor:pointer;text-align:center;padding:20px}
#startOverlay h2{color:var(--text-header);font-size:clamp(1.5rem, 5vw, 2.5rem);margin-bottom:20px}
#startOverlay p{color:#ccc;font-size:clamp(0.8rem, 3vw, 1.2rem)}
.btn-start{margin-top:30px;padding:12px 30px;background:var(--accent);color:#000;font-size:clamp(0.9rem, 3vw, 1.2rem);font-weight:bold;border:none;border-radius:50px;cursor:pointer;}
</style>
</head>
<body>

<div id="startOverlay" onclick="startDisplay()">
    <h2>SELAMAT DATANG</h2>
    <p>Klik layar ini untuk memulai pemutaran video & mengaktifkan suara.</p>
    <button class="btn-start">▶ MULAI DISPLAY</button>
</div>

<header class="header">
    <div class="header-left">
        <img id="aptLogo" src="">
        <div class="text-block">
            <div class="apt-name" id="aptName">NAMA APARTEL</div>
            <div class="apt-address" id="aptAddress">Alamat</div>
        </div>
    </div>
    <div class="header-right">
        <div class="clock" id="clockTime">00:00</div>
        <div class="date" id="clockDate">Tanggal</div>
    </div>
</header>

<div class="video-container" id="videoContainer">
    <iframe id="youtubePlayer" src="" allow="autoplay; fullscreen; encrypted-media" allowfullscreen style="display:none;"></iframe>
    <video id="videoPlayer" autoplay playsinline></video>
</div>

<footer class="footer">
    <div class="ticker-wrap" id="aptTicker">
        <div class="ticker-text"><span>★</span> Memuat teks... </div>
        <div class="ticker-text"><span>★</span> Memuat teks... </div>
    </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlNDaftpdvCvtCq3S9JjBHileRQnDaZAY",
  authDomain: "robot-pintar-7b1a3.firebaseapp.com",
  databaseURL: "https://robot-pintar-7b1a3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "robot-pintar-7b1a3",
  storageBucket: "robot-pintar-7b1a3.firebasestorage.app",
  messagingSenderId: "908302592700",
  appId: "1:908302592700:web:0cd39ac0dcaaaa4704feb9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let videoList = [];
let currentVideoIdx = 0;
let mp4Player = document.getElementById('videoPlayer');
let ytIframe = document.getElementById('youtubePlayer');

// 1. Update Jam
function updateClock() {
    let d = new Date();
    let h = String(d.getHours()).padStart(2, '0');
    let m = String(d.getMinutes()).padStart(2, '0');
    let s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clockTime').innerText = `${h}:${m}:${s}`;
    let days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    let months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    document.getElementById('clockDate').innerText = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
setInterval(updateClock, 1000); updateClock();

// 2. Load Warna
db.ref('apartemen/colors').on('value', (snap) => {
    if(snap.exists()) {
        let c = snap.val();
        let root = document.documentElement.style;
        root.setProperty('--bg-main', c.bg_main || '#000');
        root.setProperty('--bg-video', c.bg_video || '#000');
        root.setProperty('--text-header', c.text_header || '#ffd700');
        root.setProperty('--accent', c.accent || '#ffd700');
        root.setProperty('--bg-ticker', c.bg_ticker || '#0a0a0a');
        root.setProperty('--text-ticker', c.text_ticker || '#fff');
        root.setProperty('--text-address', c.text_address || '#ccc');
    }
});

// 3. Load Teks, Nama, Logo, & Wallpaper
db.ref('apartemen/settings').on('value', (snap) => {
    if(snap.exists()) {
        document.getElementById('aptName').innerText = snap.val().nama || 'Nama Apartel';
        document.getElementById('aptAddress').innerText = snap.val().alamat || 'Alamat';
        
        let wp = snap.val().wallpaper;
        if(wp) document.getElementById('videoContainer').style.backgroundImage = `url('${wp}')`;
        
        let logoUrl = snap.val().logo;
        let logoEl = document.getElementById('aptLogo');
        if(logoUrl) {
            logoEl.src = logoUrl;
            logoEl.style.display = 'block';
        } else {
            logoEl.style.display = 'none';
        }
        
        let t = snap.val().ticker || 'Selamat Datang';
        let textHtml = `<div class="ticker-text"><span>★</span> ${t} </div>`;
        document.getElementById('aptTicker').innerHTML = textHtml + textHtml;
    }
});

// 4. Load Video & Playlist Logic
db.ref('apartemen/videos').on('value', (snap) => {
    videoList = [];
    if(snap.exists()) {
        snap.forEach(c => {
            let url = c.val().url;
            let ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
            if(ytMatch) {
                videoList.push({ type: 'youtube', id: ytMatch[1] });
            } else if(url.match(/\.(mp4|webm|ogg)$/i)) {
                videoList.push({ type: 'mp4', url: url });
            }
        });
        currentVideoIdx = 0;
        playCurrentVideo();
    }
});

function playCurrentVideo() {
    if(videoList.length === 0) return;
    let item = videoList[currentVideoIdx];

    if(item.type === 'youtube') {
        mp4Player.style.display = 'none';
        ytIframe.style.display = 'block';
        ytIframe.src = `https://www.youtube.com/embed/${item.id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&loop=1`;
    } else if(item.type === 'mp4') {
        ytIframe.style.display = 'none';
        ytIframe.src = '';
        mp4Player.style.display = 'block';
        mp4Player.src = item.url;
        mp4Player.load();
        mp4Player.play().catch(e => console.log("Menunggu klik untuk suara..."));
    }
}

mp4Player.addEventListener('ended', () => {
    currentVideoIdx = (currentVideoIdx + 1) % videoList.length;
    playCurrentVideo();
});

window.addEventListener('message', (event) => {
    try {
        let data = JSON.parse(event.data);
        if(data.event === 'onStateChange' && data.info === 0) {
            currentVideoIdx = (currentVideoIdx + 1) % videoList.length;
            playCurrentVideo();
        }
    } catch(e) {}
});

function startDisplay() {
    // 1. Masuk ke Mode Fullscreen
    let elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
    }

    // 2. Kunci Orientasi Layar ke Landscape (jika didukung HP/TV)
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(e => console.log("Orientation lock tidak didukung di perangkat ini."));
    }

    // 3. Hilangkan overlay dan mainkan suara
    document.getElementById('startOverlay').style.display = 'none';
    
    if(mp4Player.style.display !== 'none') {
        mp4Player.muted = false;
        mp4Player.play();
    }
    if(ytIframe.style.display !== 'none') {
        ytIframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
        ytIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }
}
</script>
</body>
</html>
